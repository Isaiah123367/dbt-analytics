version: 2

models:
  - name: dim_product
    description: Product Dimension. One row per product, denormalized with its supplier and category.
    columns:
      - name: productkey
        description: The surrogate key of the product
        tests:
          - not_null
          - unique
      - name: productid
        description: The business / source key of the product
        tests:
          - not_null
          - unique
      - name: productname
        description: The name of the product
        tests:
          - not_null
      - name: suppliercompanyname
        description: Company name of the supplier of the product (from Suppliers)
      - name: categoryname
        description: Name of the product category (from Categories)
      - name: categorydescription
        description: Description of the product category (from Categories)
      - name: quantityperunit
        description: Packaging / quantity in one unit of the product
      - name: discontinued
        description: Y if the product has been discontinued, otherwise N
        tests:
          - accepted_values:
              values: ['Y', 'N']
